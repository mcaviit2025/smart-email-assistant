# Dynamic Port Support for Render / Cloud Hosts (Defaults to 8080 locally)
server.port=${PORT:8080}

# Gemini Developer API (Reads from environment variable in production, fallback to local key)
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY:AIzaSyAMcp0LdB5ROyLQ4aNeeyE5sPRtM8bLy6k}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.5
spring.ai.google.genai.chat.options.max-output-tokens=600

# Logging
logging.level.com.smartemail=INFO
logging.level.org.springframework.ai=WARN

# Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
