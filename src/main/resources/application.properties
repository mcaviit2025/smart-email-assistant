```properties
# ============================================================
# Server Configuration
# ============================================================

# Render/Cloud hosts provide PORT automatically.
# Defaults to 8080 when running locally.
server.port=${PORT:8080}


# ============================================================
# Google Gemini / Spring AI Configuration
# ============================================================

# API key is provided through an environment variable.
# Set SPRING_AI_GOOGLE_GENAI_API_KEY in your local environment
# and in Render Environment Variables.
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}

spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.5
spring.ai.google.genai.chat.options.max-output-tokens=600


# ============================================================
# Logging
# ============================================================

logging.level.com.smartemail=INFO
logging.level.org.springframework.ai=WARN


# ============================================================
# Swagger / OpenAPI
# ============================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
```
